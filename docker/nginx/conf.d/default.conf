server {
    listen 80;
    server_name localhost pintventory.com www.pintventory.com;
    return 301 https://pintventory.com$request_uri;
}

server {
    listen 443 ssl;
    server_name pintventory.com www.pintventory.com;

    ssl_certificate /etc/letsencrypt/live/pintventory.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pintventory.com/privkey.pem;

    # Basic SSL optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Increase max body size for uploads
    client_max_body_size 20M;
    
    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=30s;

    root /var/www/html/public;
    index index.php index.html;

    # Frontend (Vite)
    location / {
        set $upstream_vue vue;
        proxy_pass http://$upstream_vue:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API Routes - Pass to Laravel
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # Auth Routes (Google OAuth) - Pass to Laravel
    location /auth {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    location /sanctum {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage {
        try_files $uri =404;
    }

    # Handle PHP
    location ~ \.php$ {
        set $upstream_laravel laravel;
        fastcgi_pass $upstream_laravel:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }
}
