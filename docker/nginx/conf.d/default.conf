server {
    listen 80;
    server_name localhost;
    
    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=30s;

    root /var/www/html/public;
    index index.php index.html;

    # Frontend (Vite)
    location / {
        set $upstream_vue vue;
        proxy_pass http://$upstream_vue:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API Routes - Pass to Laravel
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # Auth Routes (Google OAuth) - Pass to Laravel
    location /auth {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    location /sanctum {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage {
        alias /var/www/html/storage/app/public;
        try_files $uri $uri/ =404;
    }

    # Handle PHP
    location ~ \.php$ {
        set $upstream_laravel laravel;
        fastcgi_pass $upstream_laravel:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
