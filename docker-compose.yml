services:
  nginx:
    container_name: pintventory-nginx
    image: nginx:alpine
    ports:
      - "8082:80"
      - "8442:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./laravel:/var/www/html
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./docker/certbot/www:/var/www/certbot:ro
    depends_on:
      - laravel
      - vue

  laravel:
    container_name: pintventory-laravel
    build:
      context: .
      dockerfile: docker/laravel/Dockerfile
    volumes:
      - ./laravel:/var/www/html
    environment:
      - APP_URL=https://pintventory.com
    depends_on:
      - postgres

  vue:
    container_name: pintventory-vue
    build:
      context: .
      dockerfile: docker/vue/Dockerfile
    volumes:
      - ./vue:/app
    ports:
      - "5174:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true

  postgres:
    container_name: pintventory-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: pintventory
      POSTGRES_USER: pintventory
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  postgres_data:
