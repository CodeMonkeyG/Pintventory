services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./laravel:/var/www/html
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - laravel
      - vue

  laravel:
    build:
      context: .
      dockerfile: docker/laravel/Dockerfile
    volumes:
      - ./laravel:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: pintventory
      DB_USERNAME: pintventory
      DB_PASSWORD: password
      APP_URL: https://pintventory.com
    command: sh -c "composer install && php-fpm"
    depends_on:
      - postgres

  vue:
    build:
      context: .
      dockerfile: docker/vue/Dockerfile
    volumes:
      - ./vue:/app
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: pintventory
      POSTGRES_USER: pintventory
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
